<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Task Manager</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1d2733;
			--muted: #647282;
			--line: #dce4e8;
			--paper: #fffdf8;
			--accent: #e86a33;
			--accent-dark: #bb4720;
			--mint: #dcefe8;
			--shadow: 0 18px 45px rgba(48, 62, 70, 0.12);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background: #f3eee6;
			font-family: Georgia, "Times New Roman", serif;
		}

		.page {
			width: min(940px, calc(100% - 32px));
			margin: 0 auto;
			padding: 56px 0 72px;
		}

		header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 30px;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent-dark);
			font: 700 0.75rem/1.2 Arial, sans-serif;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.6rem, 7vw, 4.8rem);
			font-weight: 400;
			line-height: 0.95;
			letter-spacing: -0.04em;
		}

		.intro {
			max-width: 250px;
			margin: 0;
			color: var(--muted);
			font: 0.95rem/1.5 Arial, sans-serif;
		}

		main {
			display: grid;
			grid-template-columns: minmax(250px, 0.8fr) minmax(320px, 1.2fr);
			gap: 24px;
			align-items: start;
		}

		.panel {
			padding: 28px;
			border: 1px solid rgba(220, 228, 232, 0.8);
			border-radius: 8px;
			background: var(--paper);
			box-shadow: var(--shadow);
		}

		.panel h2 {
			margin: 0 0 20px;
			font-size: 1.35rem;
			font-weight: 400;
		}

		label {
			display: block;
			margin: 16px 0 7px;
			color: var(--muted);
			font: 700 0.75rem/1.2 Arial, sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		input, textarea {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 4px;
			padding: 12px 13px;
			color: var(--ink);
			background: #fff;
			font: 1rem/1.4 Arial, sans-serif;
		}

		textarea { min-height: 112px; resize: vertical; }

		input:focus, textarea:focus {
			outline: 3px solid rgba(232, 106, 51, 0.2);
			border-color: var(--accent);
		}

		button {
			width: 100%;
			margin-top: 20px;
			border: 0;
			border-radius: 4px;
			padding: 13px 16px;
			color: #fff;
			background: var(--accent);
			cursor: pointer;
			font: 700 0.9rem Arial, sans-serif;
		}

		button:hover { background: var(--accent-dark); }

		.list-heading {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 12px;
		}

		.count {
			color: var(--muted);
			font: 0.8rem Arial, sans-serif;
		}

		#task-list {
			display: grid;
			gap: 12px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.task {
			padding: 17px 18px;
			border-left: 4px solid var(--accent);
			background: #fff;
		}

		.task h3 {
			margin: 0 0 6px;
			font-size: 1.12rem;
			font-weight: 400;
		}

		.task p {
			margin: 0;
			color: var(--muted);
			font: 0.9rem/1.45 Arial, sans-serif;
			white-space: pre-wrap;
		}

		.empty {
			padding: 36px 16px;
			color: var(--muted);
			background: var(--mint);
			text-align: center;
			font: 0.95rem/1.5 Arial, sans-serif;
		}

		.error {
			min-height: 1.2em;
			margin: 12px 0 0;
			color: var(--accent-dark);
			font: 0.85rem Arial, sans-serif;
		}

		@media (max-width: 680px) {
			.page { padding-top: 32px; }
			header { display: block; }
			.intro { margin-top: 18px; }
			main { grid-template-columns: 1fr; }
			.panel { padding: 22px; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<div>
				<p class="eyebrow">A quieter way to plan</p>
				<h1>My tasks</h1>
			</div>
			<p class="intro">Capture the next thing clearly, then keep it close.</p>
		</header>

		<main>
			<section class="panel" aria-labelledby="add-task-heading">
				<h2 id="add-task-heading">Add a task</h2>
				<form id="task-form">
					<label for="title">Task title</label>
					<input id="title" name="title" type="text" placeholder="What needs doing?" required maxlength="120">

					<label for="description">Details <span aria-hidden="true">(optional)</span></label>
					<textarea id="description" name="description" placeholder="A little context, if useful..."></textarea>

					<button type="submit">Add task</button>
					<p class="error" id="form-error" role="alert"></p>
				</form>
			</section>

			<section class="panel" aria-labelledby="task-list-heading">
				<div class="list-heading">
					<h2 id="task-list-heading">Your list</h2>
					<span class="count" id="task-count">0 tasks</span>
				</div>
				<ul id="task-list" aria-live="polite">
					<li class="empty">Loading tasks...</li>
				</ul>
			</section>
		</main>
	</div>

	<script>
		const apiUrl = new URLSearchParams(window.location.search).get('api');
		const savedApiUrl = window.localStorage.getItem('TASK_API_BASE');
		const configuredApiBase = apiUrl || window.TASK_API_BASE || savedApiUrl || 'http://localhost:3000';
		const apiBase = configuredApiBase.replace(/^(https?:\/\/)https?:\/\//i, '$1').replace(/\/$/, '');
		if (apiUrl) window.localStorage.setItem('TASK_API_BASE', apiBase);
		const isHostedPage = window.location.hostname.endsWith('github.io');
		const connectionHint = isHostedPage && apiBase.includes('localhost')
			? ' Set the public Codespaces port URL with ?api=...'
			: ' Check that port 3000 is public and the Codespace is running.';
		const form = document.querySelector('#task-form');
		const titleInput = document.querySelector('#title');
		const descriptionInput = document.querySelector('#description');
		const taskList = document.querySelector('#task-list');
		const taskCount = document.querySelector('#task-count');
		const formError = document.querySelector('#form-error');

		let tasks = [];

		function renderTasks() {
			taskList.replaceChildren();
			taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}`;

			if (tasks.length === 0) {
				const emptyState = document.createElement('li');
				emptyState.className = 'empty';
				emptyState.textContent = 'Nothing here yet. Add your first task.';
				taskList.append(emptyState);
				return;
			}

			tasks.forEach((task) => {
				const item = document.createElement('li');
				item.className = 'task';

				const title = document.createElement('h3');
				title.textContent = task.title;
				item.append(title);

				if (task.description) {
					const description = document.createElement('p');
					description.textContent = task.description;
					item.append(description);
				}

				taskList.append(item);
			});
		}

		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			const title = titleInput.value.trim();
			const description = descriptionInput.value.trim();

			if (!title) {
				formError.textContent = 'Please enter a task title.';
				titleInput.focus();
				return;
			}

			formError.textContent = '';
			const submitButton = form.querySelector('button');
			submitButton.disabled = true;
			submitButton.textContent = 'Adding...';

			try {
				const response = await fetch(`${apiBase}/api/tasks`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ title, description }),
				});

				if (!response.ok) {
					const result = await response.json().catch(() => ({}));
					throw new Error(result.error || 'Could not add task.');
				}

				const task = await response.json();
				tasks.unshift(task);
				renderTasks();
				form.reset();
				titleInput.focus();
			} catch (error) {
				formError.textContent = `${error.message || 'Could not connect to the task API.'} (${apiBase}).${connectionHint}`;
			} finally {
				submitButton.disabled = false;
				submitButton.textContent = 'Add task';
			}
		});

		async function loadTasks() {
			try {
				const response = await fetch(`${apiBase}/api/tasks`);
				if (!response.ok) throw new Error('Could not load tasks.');
				tasks = await response.json();
				renderTasks();
			} catch (error) {
				taskList.replaceChildren();
				const errorState = document.createElement('li');
				errorState.className = 'empty';
				errorState.textContent = `Could not connect to the task API at ${apiBase}.${connectionHint}`;
				taskList.append(errorState);
				taskCount.textContent = 'Unavailable';
			}
		}

		loadTasks();
	</script>
</body>
</html>
